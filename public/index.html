<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2EFE7">
<title>Dayboard</title>
<script>
if (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 900 && !/[?&]display/.test(location.search)) location.replace('/remote');
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231A1C21'/%3E%3Cpath d='M9 19a7 7 0 0 1 14 0' fill='none' stroke='%23D7F452' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='12' r='2.4' fill='%23D7F452'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<canvas id="night" aria-hidden="true"></canvas>
<div id="shell">
  <nav class="rail" id="rail" aria-label="Pages"></nav>
  <main class="main" id="pages"></main>
</div>

<div id="modal-veil" class="veil" hidden></div>

<div id="alarm-veil" class="veil alarm-veil" hidden>
  <div class="alarm-full">
    <div class="bellbig" id="alarm-bell"></div>
    <div class="at" id="alarm-at"></div>
    <div class="label" id="alarm-label"></div>
    <div class="alarm-actions">
      <button class="btn big ghost" data-act="snooze">Snooze 5 min</button>
      <button class="btn big" data-act="dismiss">Space to dismiss</button>
    </div>
    <div class="hint">Z to snooze · auto-snooze in 3 min</div>
  </div>
</div>

<div id="alert-veil" class="veil alert-veil" hidden>
  <div class="alarm-full">
    <div class="bellbig alerticon" id="alert-icon"></div>
    <div class="label" id="alert-title"></div>
    <div class="msg" id="alert-msg"></div>
    <div class="alarm-actions">
      <button class="btn big" data-act="alert-dismiss">Space to dismiss</button>
    </div>
    <div class="hint">Esc also dismisses · auto in 10s</div>
  </div>
</div>

<div id="note-veil" class="fullview" hidden>
  <div class="note-full c-butter" id="note-full">
    <div class="nf-text" id="nf-text"></div>
    <div class="nf-foot"><span id="nf-idx"></span><span id="nf-time"></span></div>
    <div class="nf-hint">← → switch note · Esc to go back</div>
  </div>
</div>

<div id="cal-veil" class="fullview" hidden>
  <div class="cal-full card">
    <div class="cf-head">
      <button class="icon-btn" data-act="fcal-prev" aria-label="Previous month"></button>
      <div class="cf-title" id="cf-title"></div>
      <button class="icon-btn" data-act="fcal-next" aria-label="Next month"></button>
    </div>
    <div class="cal-grid big" id="cf-grid"></div>
    <div class="nf-hint">← → change month · Esc to go back</div>
  </div>
</div>

<div id="saver">
  <video id="saver-video" muted loop playsinline autoplay hidden></video>
  <div class="sv-view standby" id="standby">
    <div class="sb-clock"><span id="sb-time">9:41</span><span class="ampm" id="sb-ampm">AM</span></div>
    <div class="sb-sub" id="sb-sub"></div>
  </div>
  <div class="sv-view quote" id="sv-quote">
    <div class="q-text serif" id="q-text"></div>
    <div class="q-author" id="q-author"></div>
    <div class="sv-corner"><span id="sq-time"></span><small id="sq-ampm"></small></div>
  </div>
  <div class="sv-view tasks" id="sv-tasks">
    <div class="st-head">Today <span class="chip" id="st-count"></span></div>
    <div class="st-list" id="st-list"></div>
    <div class="sv-corner"><span id="st-time"></span><small id="st-ampm"></small></div>
  </div>
  <div class="sb-video-clock" id="sb-video-clock" hidden><span id="sv-time"></span><small id="sv-ampm"></small></div>
</div>

<div id="wipe-blur" aria-hidden="true"></div>
<div id="wipe" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<script src="/app.js"></script>
</body>
</html>
