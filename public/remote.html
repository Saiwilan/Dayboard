<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EFE7">
<title>Dayboard · Remote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231A1C21'/%3E%3Cpath d='M9 19a7 7 0 0 1 14 0' fill='none' stroke='%23D7F452' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='12' r='2.4' fill='%23D7F452'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body class="remote">
<div class="r-wrap">
  <header class="r-head">
    <span class="logo" id="r-logo"></span>
    <h1>Dayboard</h1>
    <div class="right">
      <button class="icon-btn" data-act="wake" title="Wake display" aria-label="Wake display" id="r-wake"></button>
      <button class="icon-btn" data-act="sleep" title="Sleep display" aria-label="Sleep display" id="r-sleep"></button>
      <button class="icon-btn" data-act="theme" title="Theme" aria-label="Toggle theme" id="r-theme"></button>
      <a class="icon-btn" href="/?display=1" title="Open display view" aria-label="Open display view" id="r-display"></a>
    </div>
  </header>
  <div id="r-pages"></div>
</div>
<nav class="r-tabs" id="r-tabs" aria-label="Sections"></nav>
<button class="r-fab" id="r-fab" data-act="add" aria-label="Add"></button>
<div id="modal-veil" class="veil" hidden></div>
<div id="alarm-veil" class="veil alarm-veil" hidden>
  <div class="modal alarm-modal">
    <div class="bellbig" id="alarm-bell"></div>
    <div class="at" id="alarm-at"></div>
    <div class="label" id="alarm-label"></div>
    <div class="actions" style="justify-content:center;flex-wrap:wrap">
      <button class="btn ghost" style="font-size:1.15rem;padding:.9rem 1.8rem" data-act="snooze">Snooze 5 min</button>
      <button class="btn" style="font-size:1.15rem;padding:.9rem 1.8rem" data-act="dismiss">Dismiss</button>
    </div>
    <div class="r-muted" style="text-align:center;margin-top:.7rem">Auto-snoozes after 3 min</div>
  </div>
</div>
<div id="toast" role="status"></div>
<script src="/remote.js"></script>
</body>
</html>
